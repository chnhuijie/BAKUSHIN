<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bakushin Embed Builder</title>
  <style>
    /* --- THEME SETTINGS --- */
    body {
      background-color: #ee6fab;
      color: white;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 1200px;
    }

    /* --- HEADER STYLING --- */
    .site-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid white;
    }

    .header-mascot {
      width: 120px;
      height: auto;
    }

    .header-title h1 {
      margin: 0 0 5px 0;
      font-size: 32px;
      letter-spacing: 1px;
    }

    .header-title p {
      margin: 0;
      font-size: 16px;
      color: #ffd1e3;
    }

    /* --- TOP BAR (ROUTING) --- */
    .top-bar {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      justify-content: center;
    }

    input, textarea, select {
      background-color: #523e57;
      border: 2px solid white;
      color: white;
      padding: 12px;
      font-size: 14px;
      width: 100%;
      box-sizing: border-box;
      outline: none;
    }
    
    input::placeholder, textarea::placeholder {
      color: #b0a5b5;
      text-align: center;
    }

    .top-bar input {
      width: 300px;
      text-align: center;
    }

    /* --- MAIN LAYOUT GRID --- */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 40px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* --- BUTTONS --- */
    button {
      background-color: #523e57;
      border: 2px solid white;
      color: white;
      padding: 12px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: #6a5070;
    }

    #sendBtn {
      background-color: #4CAF50;
      border-color: white;
      margin-top: 20px;
      font-size: 16px;
    }
    #sendBtn:hover { background-color: #45a049; }

    /* --- SPECIAL BOXES --- */
    .static-box {
      background-color: #523e57;
      border: 2px solid white;
      padding: 15px;
      font-size: 13px;
      line-height: 1.6;
    }

    .timestamp-box {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #descInput {
      height: 300px;
      resize: vertical;
      text-align: left;
    }
    #descInput::placeholder { text-align: center; line-height: 250px; }

    /* --- PREVIEW WINDOW --- */
    .preview-window {
      background-color: #36393f;
      border: 2px solid white;
      min-height: 500px;
      padding: 20px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
    }

    .embed-mockup {
      background-color: #2f3136;
      border-left: 4px solid #FF77AA; 
      border-radius: 4px;
      padding: 15px;
      display: none;
    }

    .embed-title { font-weight: bold; color: white; margin-bottom: 8px; font-size: 16px; }
    .embed-img { max-width: 100%; border-radius: 4px; }
    
    /* --- PREVIEW MARKDOWN STYLING --- */
    .embed-desc { 
      color: #dcddde; 
      font-size: 14px; 
      margin-bottom: 15px; 
      line-height: 1.3;
    }
    .embed-desc a { color: #00aff4; text-decoration: none; }
    .embed-desc a:hover { text-decoration: underline; }
    
    /* Force exact Discord header scaling */
    .embed-desc h1.md-h1 { margin: 16px 0 8px 0 !important; font-size: 24px !important; font-weight: bold !important; color: white !important; line-height: 1.2 !important; }
    .embed-desc h2.md-h2 { margin: 14px 0 6px 0 !important; font-size: 20px !important; font-weight: bold !important; color: white !important; line-height: 1.2 !important; }
    .embed-desc h3.md-h3 { margin: 12px 0 4px 0 !important; font-size: 16px !important; font-weight: bold !important; color: white !important; line-height: 1.2 !important; }
    
    /* List styling to mimic Discord's indent */
    .embed-desc .md-ul, .embed-desc .md-ol { 
      padding-left: 16px; 
      text-indent: -12px;
      margin-top: 2px;
    }
    
    .embed-desc strong { font-weight: bold; color: white; }
    .embed-desc .discord-ping { background-color: rgba(88, 101, 242, 0.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- HEADER BLOCK -->
    <div class="site-header">
      <img src="BakushinO.png" alt="Bakushin Mascot" class="header-mascot">
      <div class="header-title">
        <h1>Class President's Embed Builder</h1>
      </div>
    </div>

    <!-- Top Bar: Webhook & IDs -->
    <div class="top-bar">
      <input type="password" id="webhookInput" placeholder="Enter Webhook here">
      <input type="text" id="channelIdInput" placeholder="Enter Channel ID">
      <input type="text" id="messageIdInput" placeholder="Enter Message ID (Editing)">
    </div>

    <div class="grid">
      <!-- Left Panel: Content & Utilities -->
      <div class="left-panel">
        <input type="text" id="titleInput" placeholder="Enter Embed Title Here">
        <input type="text" id="imageInput" placeholder="Enter image/gif link here">
        <input type="text" id="colorInput" placeholder="Hex Color (Optional, default is Bakushin Pink: FF77AA)">

        <!-- Timestamp Generator -->
        <div class="static-box timestamp-box">
          <label><strong>Timestamp Generator:</strong></label>
          <input type="datetime-local" id="timePicker" style="width: 200px;">
          <input type="text" id="timeOutput" readonly placeholder="<t:00000000:R>">
        </div>

        <!-- Cheat Sheet -->
        <div class="static-box">
          <strong>Discord Text Formats:</strong><br>
          <span style="color: #b0a5b5;">
            Headers: <code># H1</code> | <code>## H2</code> | <code>### H3</code><br>
            Text: <code>**Bold**</code> | <code>*Italic*</code> | <code>__Underline__</code> | <code>~~Strike~~</code><br>
            Lists: Bullet <code>* Text</code> | Number <code>1. Text</code><br>
            Links: <code>[Clickable Text](URL_HERE)</code><br>
            Pings: Roles <code>&lt;@&amp;ROLE_ID&gt;</code> | Emojis <code>&lt;:name:ID&gt;</code>
          </span>
        </div>

        <textarea id="descInput" placeholder="Enter description here (optional)"></textarea>
      </div>

      <!-- Right Panel: Preview & Send -->
      <div class="right-panel">
        <button id="previewBtn">Generate Preview</button>
        
        <div class="preview-window">
          <div style="text-align: center; color: #72767d; margin-top: 200px;" id="previewPlaceholder">PREVIEW</div>
          
          <div class="embed-mockup" id="embedMockup">
            <div class="embed-title" id="previewTitle"></div>
            <!-- Swapped to support HTML rendering for the Markdown Parser -->
            <div class="embed-desc" id="previewDesc"></div>
            <img class="embed-img" id="previewImg" src="" alt="">
          </div>
        </div>

        <button id="sendBtn">BAKUSHIN! Send to Server</button>
      </div>
    </div>
  </div>

  <script>
    // --- TIMESTAMP GENERATOR LOGIC ---
    document.getElementById('timePicker').addEventListener('change', function() {
      const date = new Date(this.value);
      if (!isNaN(date.getTime())) {
        const unixTime = Math.floor(date.getTime() / 1000);
        document.getElementById('timeOutput').value = `<t:${unixTime}:R>`;
      }
    });

    // --- DISCORD MARKDOWN PARSER ---
    function parseDiscordMarkdown(text) {
      if (!text) return "";

      // Normalize line endings to avoid hidden carriage returns breaking the layout
      let html = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

      // 1. Sanitize HTML first to prevent code injection
      html = html
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      // 2. Parse Headers (Using semantic H tags for guaranteed scaling)
      html = html.replace(/^###\s+(.*)$/gm, '<h3 class="md-h3">$1</h3>');
      html = html.replace(/^##\s+(.*)$/gm, '<h2 class="md-h2">$1</h2>');
      html = html.replace(/^#\s+(.*)$/gm, '<h1 class="md-h1">$1</h1>');

      // 3. Parse Lists (Bullets and Numbers)
      html = html.replace(/^[\*\-]\s+(.*)$/gm, '<div class="md-ul"><span>•</span> <span>$1</span></div>');
      html = html.replace(/^(\d+)\.\s+(.*)$/gm, '<div class="md-ol"><span>$1.</span> <span>$2</span></div>');

      // 4. Parse Bold, Italic, Underline, Strikethrough
      html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
      html = html.replace(/__(.*?)__/g, '<u>$1</u>');
      html = html.replace(/~~(.*?)~~/g, '<del>$1</del>');

      // 5. Parse Links
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');

      // 6. Parse Pings to look like Discord Tags
      html = html.replace(/&lt;@&amp;(\d+)&gt;/g, '<span class="discord-ping">@Role</span>');
      html = html.replace(/&lt;@(\d+)&gt;/g, '<span class="discord-ping">@User</span>');
      html = html.replace(/&lt;:(\w+):(\d+)&gt;/g, ':$1:');

      // 7. Convert Line breaks to <br> tags
      html = html.replace(/\n/g, '<br>');
      
      // 8. Clean up extra line breaks right after our custom block elements
      html = html.replace(/<\/(h1|h2|h3|div)><br>/g, '</$1>');

      return html;
    }

    // --- PREVIEW LOGIC ---
    document.getElementById('previewBtn').addEventListener('click', function() {
      const title = document.getElementById('titleInput').value;
      const desc = document.getElementById('descInput').value;
      const imgUrl = document.getElementById('imageInput').value;
      let color = document.getElementById('colorInput').value.replace('#', '');
      
      const mockup = document.getElementById('embedMockup');
      const placeholder = document.getElementById('previewPlaceholder');

      placeholder.style.display = 'none';
      mockup.style.display = 'block';

      document.getElementById('previewTitle').textContent = title;
      
      // Inject the newly parsed Markdown HTML instead of raw text
      document.getElementById('previewDesc').innerHTML = parseDiscordMarkdown(desc);
      
      const validHex = /^[0-9A-F]{6}$/i.test(color) ? color : 'FF77AA';
      mockup.style.borderLeftColor = `#${validHex}`;

      const imgElement = document.getElementById('previewImg');
      if (imgUrl) {
        imgElement.src = imgUrl;
        imgElement.style.display = 'block';
      } else {
        imgElement.style.display = 'none';
      }
    });

    // --- WEBHOOK RELAY LOGIC ---
    document.getElementById('sendBtn').addEventListener('click', async function() {
      const webhook = document.getElementById('webhookInput').value;
      const channelId = document.getElementById('channelIdInput').value;
      const messageId = document.getElementById('messageIdInput').value;
      const title = document.getElementById('titleInput').value;
      const desc = document.getElementById('descInput').value;
      const imgUrl = document.getElementById('imageInput').value;
      let colorStr = document.getElementById('colorInput').value.replace('#', '');

      if (!webhook || !channelId) {
        return alert("Error: You must provide the Webhook URL and Target Channel ID!");
      }
      if (!title && !desc && !imgUrl) {
        return alert("Error: The embed cannot be completely empty!");
      }

      let colorVal = parseInt(colorStr, 16);
      if (isNaN(colorVal)) colorVal = 16742314; 

      let commandText = channelId;
      if (messageId) {
        commandText = `EDIT ${channelId} ${messageId}`;
      }

      const embedPayload = { color: colorVal };
      if (title) embedPayload.title = title;
      if (desc) embedPayload.description = desc;
      if (imgUrl) embedPayload.image = { url: imgUrl };

      const discordPayload = {
        content: commandText,
        embeds: [embedPayload]
      };

      try {
        const response = await fetch(webhook, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(discordPayload)
        });

        if (response.ok) {
          alert("Success! The embed has been routed to Bakushin.");
        } else {
          alert("Error: Discord rejected the webhook. Check your URL.");
        }
      } catch (err) {
        console.error(err);
        alert("A network error occurred while sending.");
      }
    });
  </script>
</body>
</html>
